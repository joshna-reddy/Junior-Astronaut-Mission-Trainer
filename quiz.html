
<!DOCTYPE html>
<html>
<head>
    <title>Space Knowledge Quiz</title>

    <style>
        body {
            background: #080824;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #75d9ff;
        }

        #quiz-box {
            background: #171744;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #75d9ff;
        }

        #result {
            color: #ffe66d;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1> Space Knowledge Quiz</h1>
    <p>Test your knowledge about the universe!</p>

    <div id="quiz-box">

        <h2 id="question">Question appears here</h2>

        <div id="options"></div>

        <p id="result"></p>

        <p id="score">Score: 0</p>

        <button onclick="nextQuestion()" id="next">
            Next Question
        </button>

        <button onclick="window.location.href='/'">
            Back to Home
        </button>

    </div>

    <script src="{{ url_for('static', filename='quiz.js') }}"></script>

</body>
</html>
